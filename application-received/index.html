<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260522g">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png?v=20260522g">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260522g">
  <link rel="shortcut icon" href="/favicon.ico?v=20260522g">
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ICONENT — Application Received</title>
  <meta name="description" content="Your application has been submitted. Book your free strategy call to lock in your spot." />

  <link rel="stylesheet" href="/assets/css/tokens.css?v=20260522e" />
  <link rel="stylesheet" href="/assets/css/base.css?v=20260523c" />
  <link rel="stylesheet" href="/assets/css/components.css?v=20260523e" />
  <link rel="stylesheet" href="/assets/css/pages/application-received.css?v=20260523d" />
</head>
<body class="ar-page">

  <main id="main" class="ar-main">

    <h1 class="ar-title">Under <span class="accent">Review</span></h1>
    <p class="ar-sub">Step 1 done — lock in your call.</p>

    <ol class="ar-steps" aria-label="Application progress">
      <li class="ar-step ar-step--done">
        <span class="ar-step-num">Step 1</span>
        <span class="ar-step-bubble" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="5 12 10 17 19 7"></polyline>
          </svg>
        </span>
        <span class="ar-step-status">Done</span>
        <span class="ar-step-title">Sent</span>
      </li>
      <li class="ar-step ar-step--active">
        <span class="ar-step-num">Step 2</span>
        <span class="ar-step-bubble" aria-hidden="true">2</span>
        <span class="ar-step-status">Now</span>
        <span class="ar-step-title">Book Call</span>
      </li>
      <li class="ar-step ar-step--upcoming">
        <span class="ar-step-num">Step 3</span>
        <span class="ar-step-bubble" aria-hidden="true">3</span>
        <span class="ar-step-status">Next</span>
        <span class="ar-step-title">Session</span>
      </li>
    </ol>

    <a class="ar-cta" href="/strategy-call/" id="ar-cta">
      Book Your Free Call
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="13 6 19 12 13 18"></polyline>
      </svg>
    </a>
    <p class="ar-footnote">Limited availability</p>

  </main>

  <script>
    (function () {
      const cta = document.getElementById('ar-cta');
      if (!cta) return;
      const params = new URLSearchParams(location.search);
      const source = params.get('source');
      if (source) {
        const u = new URL(cta.href, location.origin);
        u.searchParams.set('source', source);
        u.searchParams.set('applied', '1');
        cta.href = u.pathname + u.search;
      }
    })();
  </script>
</body>
</html>
